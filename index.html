<!DOCTYPE html>

<style>

</style></head><body>
<canvas id="c"></canvas>
<button id="b">PUSH</button>
<div id="pg"><div id="pt"><span>Pressure</span><span id="pmsg"></span></div><div id="pb"><i id="pf"></i></div></div>
<div id="r">
<button id="sp" class="s">SPREAD</button><button id="sit" class="s">SIT</button><button id="w" class="s">WIPE</button><button id="t" class="s">TOOT</button>
<button id="h" class="s">HOLD IT</button><button id="bl" class="s">BLOWOUT</button><button id="fd" class="s">FEED</button><button id="au" class="s">AUTO</button><button id="f" class="s">FLUSH</button><button id="rs" class="s">RESET</button>
</div>
<div id="s"></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),b=document.getElementById('b'),$=i=>document.getElementById(i);
const W=360,H=590;c.width=W*2;c.height=H*2;g.scale(2,2);
const X=180,Y0=128,RIM=410,BCY=416,BA=126,BB=110,WL=438,SITY=240,FL=568;
const P={hs:[28,58]};
const CW=4,NC=Math.ceil(BA*2/CW),HF=new Array(NC).fill(0);
const fy=x=>BCY+BB*Math.sqrt(Math.max(0,1-((x-X)/BA)**2)),capAt=x=>fy(x)-(WL-26);
const KF=[[28,58],[46,72],[92,46],[3,66],[22,8]];
function hsFor(v){const p=Math.min(.9999,Math.max(0,v))*(KF.length-1),i=Math.floor(p),f=p-i,a=KF[i],q=KF[i+1];return [a[0]+(q[0]-a[0])*f,a[1]+(q[1]-a[1])*f].map(n=>Math.round(n*10)/10)}
const C=(hs,l,a=1)=>'hsla('+hs[0]+','+hs[1]+'%,'+l+'%,'+a+')';
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const SK=[['#fbe0cc','#f0bf9c','#cf9170'],['#f4d2b4','#e2aa84','#bb7e5b'],['#c58b63','#9a6341','#6e4128'],['#8a5a3c','#66402a','#43281a']];
function mixHex(a,b,t){const pa=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),pb=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return '#'+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function skinCols(){const p=Math.min(.999,Math.max(0,P.skin))*3,i=Math.floor(p),f=p-i;return SK[i].map((c,k)=>mixHex(c,SK[i+1][k],f))}
let len=0;
const defs=[['liq','Liquidity',0,100,30,100],['sz','Thickness',22,60,38,1],['spd','Speed',30,600,100,100],['firm','Solidity',0,100,55,100],['stick','Stickiness',0,100,40,100],['grav','Gravity',20,200,100,100],['cln','Squeeze',0,200,100,100],['lump','Lumpiness',0,100,35,100],['chunk','Chunkiness',0,100,15,100],['mush','Mush rate',0,100,0,100],['fr','Fart / Poop',0,100,0,100],['strain','Strain time',0,100,55,100],['mess','Messiness',0,150,70,100],['spl','Splash',0,300,60,100],['col','Color',0,100,0,100],['skin','Skin tone',0,100,33,100],['sheen','Sheen',0,100,50,100],['gas','Gassiness',0,100,40,100],['pitch','Fart pitch',50,200,100,100],['vol','Volume',0,100,60,100]];
const box=$('s'),SL=[];
let saved={};try{saved=JSON.parse(localStorage.getItem('pns')||'{}')}catch(e){}
for(const [k,t,mn,mx,v,dv] of defs){
  const sp=document.createElement('span');sp.textContent=t;
  const i=document.createElement('input');i.type='range';i.min=mn;i.max=mx;i.value=saved[k]!==undefined?saved[k]:v;
  i.oninput=()=>{
    P[k]=i.value/dv;
    try{const sv=JSON.parse(localStorage.getItem('pns')||'{}');sv[k]=+i.value;localStorage.setItem('pns',JSON.stringify(sv))}catch(e){}
  };
  P[k]=i.value/dv;box.append(sp,i);SL.push({i,k,v,dv});
}
let state='idle',sn=0,cl=0,cut=false,strain=0,sq=0,pieces=[],cur=null,fl=[],stains=[],bst=[],gp=[];
let pm=false,flushing=false,emitAcc=0,clk=0,plopT=0,curSp=0,pokeAmt=0,spreadOn=false,openAmt=0,openF=1;
let wipeOn=false,wipePos=null,wipeT=0,pileHs=[28,58],by=0,hy=Y0,hx=X,bx=0,byv=0,seated=false,sitAmt=0,sitting=false,grab=null,gpos=[0,0],holdOn=false,pres=0,smear=0,red=0,bit=null,strand=null,shake=0,blow=null,lastMess=-99,NID=0,bubs=[],stm=[],stored=0,nextRumble=0,hr=2.5,dil=0,auto=false,autoT=0,lastSq=0,hbs=[],SKC=['#f4d2b4','#e2aa84','#bb7e5b'];
let last=performance.now(),acc=0;
const pull=[0,0],pullT=[0,0],jg=[0,0],jv=[0,0],mark=[0,0];
let gasT=0,gasPulse=0,pushT=0,lead=0,crown=0,crowned=false,nextRumbleS=0;

// ---------- audio
let AC=null,N1,NG,NF,OS,OF,OG,OUT,ECHO,BO,BG;
function audioInit(){
  if(AC){if(AC.state!=='running')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    OUT=AC.createGain();OUT.connect(AC.destination);
    const dl=AC.createDelay(.3);dl.delayTime.value=.05;const fb=AC.createGain();fb.gain.value=.4;ECHO=AC.createGain();ECHO.gain.value=.06;
    OUT.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(ECHO);ECHO.connect(AC.destination);
    const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    N1=AC.createBufferSource();N1.buffer=nb;N1.loop=true;
    NF=AC.createBiquadFilter();NF.type='bandpass';NF.Q.value=2;
    NG=AC.createGain();NG.gain.value=0;N1.connect(NF);NF.connect(NG);NG.connect(OUT);
    OS=AC.createOscillator();OS.type='sawtooth';OS.frequency.value=70;
    OF=AC.createBiquadFilter();OF.type='lowpass';OF.frequency.value=380;
    OG=AC.createGain();OG.gain.value=0;OS.connect(OF);OF.connect(OG);OG.connect(OUT);
    N1.start();OS.start();
  }catch(e){AC=null}
}
function soundTick(t){
  if(!AC)return;
  const bI=blow?Math.min(1.3,stored/1.2):0,on=((state==='push')||bI>0)&&P.vol>0,amt=state==='push'?1:0;
  const T=AC.currentTime,l=P.liq,gs=P.gas;
  const pulse=.45+.55*Math.pow(Math.max(0,Math.sin(t*(8+l*10)+Math.sin(t*2.3)*3)),.6);
  const fl2=Math.sin(t*(28+gs*20));
  NG.gain.setTargetAtTime(on?P.vol*(amt*(.05+.28*l)*(1-.85*P.fr)+bI*.55)*pulse:0,T,.03);
  NF.frequency.setTargetAtTime(180+420*(.5+.5*Math.sin(t*(5+l*9)))+120*Math.random()+bI*500,T,.03);
  OG.gain.setTargetAtTime(on?P.vol*(amt*(.04+.3*gs)*(.5-.35*P.fr)+bI*.45)*(.6+.4*fl2)*(.6+.4*pulse):0,T,.02);
  OS.frequency.setTargetAtTime((48+gs*70*(.6+.4*Math.sin(t*2.1))+12*fl2*gs-bI*14)*P.pitch,T,.03);
  OF.frequency.setTargetAtTime(220+gs*500+bI*300,T,.05);
  ECHO.gain.setTargetAtTime(sitting?.32:.06,T,.3);
}
function tone(f0,f1,dur,gain,type,lp){
  if(!AC||P.vol<=0)return;
  const T=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type;f.type='lowpass';f.frequency.value=lp;
  o.frequency.setValueAtTime(f0,T);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),T+dur);
  gn.gain.setValueAtTime(.0001,T);gn.gain.linearRampToValueAtTime(P.vol*gain,T+.02);gn.gain.exponentialRampToValueAtTime(.001,T+dur);
  o.connect(f);f.connect(gn);gn.connect(OUT);o.start(T);o.stop(T+dur+.05);
}
function noiseBurst(type,f0,q,dur,gain){
  if(!AC||P.vol<=0)return;
  const T=AC.currentTime,n=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  n.buffer=N1.buffer;f.type=type;f.frequency.value=f0;f.Q.value=q;
  gn.gain.setValueAtTime(P.vol*gain,T);gn.gain.exponentialRampToValueAtTime(.001,T+dur);
  n.connect(f);f.connect(gn);gn.connect(OUT);n.start(T,Math.random());n.stop(T+dur+.02);
}
function toot(){tone((60+P.gas*90)*P.pitch,45,.25,.1+.3*P.gas,'sawtooth',500)}
function pop(){tone(190,55,.12,.35,'sine',900);if(P.liq>.4)tone(420,120,.14,.15*P.liq,'triangle',900)}
function plop(k=1){tone(260-100*P.liq,60,.22,.35*k,'sine',900);if(P.liq>.3)noiseBurst('bandpass',260,3,.14,.2*k)}
function slap(k){noiseBurst('bandpass',1500,.8,.12,.5+.4*k);tone(180,60,.12,.3,'sine',500)}
function hiss(){noiseBurst('highpass',3000,.7,.12,.12)}
function clack(k=1){tone(520+Math.random()*320,300,.045,.28*k,'square',2600);noiseBurst('highpass',2500,.7,.05,.3*k)}
function plink(){tone(900+Math.random()*400,500,.04,.08,'sine',3000)}
function bubblePop(){tone(600+Math.random()*500,250,.05,.1,'sine',3000)}
function thud(){tone(70,35,.2,.6,'sine',300);noiseBurst('lowpass',400,.7,.12,.4)}
function creak(){tone(300+Math.random()*80,220,.3,.1,'sawtooth',900)}
function squelch(){noiseBurst('bandpass',300,4,.12,.25);tone(120,70,.1,.15,'sawtooth',400)}
function squishSnd(k=1){noiseBurst('bandpass',220,2.5,.18,.45*k);tone(130,55,.14,.3*k,'sawtooth',500)}
function gurgle(){for(let i=0;i<12;i++)setTimeout(()=>tone(150+Math.random()*100,80,.08,.12,'sine',600),1200+i*110);setTimeout(()=>noiseBurst('highpass',5000,.7,1.6,.06),2400)}
function flushSnd(){
  if(!AC||P.vol<=0)return;
  const T=AC.currentTime,n=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();
  n.buffer=N1.buffer;f.type='lowpass';f.frequency.setValueAtTime(1500,T);f.frequency.exponentialRampToValueAtTime(250,T+1.4);
  gn.gain.setValueAtTime(.0001,T);gn.gain.linearRampToValueAtTime(P.vol*.3,T+.2);gn.gain.exponentialRampToValueAtTime(.001,T+1.5);
  n.connect(f);f.connect(gn);gn.connect(OUT);n.start(T);n.stop(T+1.6);
}
function brap(delay,dur,f0,f1,gain,o){
  if(!AC||P.vol<=0)return;
  o=o||{};
  const T=AC.currentTime+delay,n=Math.max(12,Math.round(dur*60));
  const flap=o.flap==null?.5:o.flap,jit=o.jit==null?.14:o.jit,wet=o.wet==null?.3:o.wet,cv=o.curve||1.3;
  const fc=new Float32Array(n),gc=new Float32Array(n);
  let wander=1;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    wander=Math.max(.75,Math.min(1.25,wander+(Math.random()-.5)*jit*.9));
    fc[i]=Math.max(25,(f0+(f1-f0)*Math.pow(t,cv))*wander);
    const env=Math.min(1,t*14)*Math.pow(1-t,.6),sput=1-flap*(Math.random()<.35?Math.random():0);
    gc[i]=Math.max(0,env*sput);
  }
  const mk=(type,det)=>{const os=AC.createOscillator();os.type=type;const a=new Float32Array(n);for(let i=0;i<n;i++)a[i]=fc[i]*det;os.frequency.setValueCurveAtTime(a,T,dur);return os};
  const o1=mk('sawtooth',1),o2=mk('sawtooth',1.013),sub=mk('sine',.5);
  const sum=AC.createGain(),sh=AC.createWaveShaper(),lp=AC.createBiquadFilter(),amp=AC.createGain(),sg=AC.createGain(),out=AC.createGain();
  const cvv=new Float32Array(256);for(let i=0;i<256;i++)cvv[i]=Math.tanh((i/128-1)*(2.2+2*(o.harsh||0)));
  sh.curve=cvv;
  lp.type='lowpass';lp.Q.value=4;lp.frequency.setValueAtTime(900+400*(o.bright||0),T);lp.frequency.exponentialRampToValueAtTime(300,T+dur);
  sg.gain.value=.6;o1.connect(sum);o2.connect(sum);sub.connect(sg);sg.connect(amp);sum.connect(sh);sh.connect(lp);lp.connect(amp);
  if(wet>0){
    const nz=AC.createBufferSource(),bp=AC.createBiquadFilter(),ng=AC.createGain();
    nz.buffer=N1.buffer;bp.type='bandpass';bp.frequency.value=500+300*Math.random();bp.Q.value=.9;ng.gain.value=wet*.45;
    nz.connect(bp);bp.connect(ng);ng.connect(amp);nz.start(T,Math.random());nz.stop(T+dur+.05);
  }
  amp.gain.setValueCurveAtTime(gc,T,dur);
  out.gain.value=P.vol*gain;amp.connect(out);out.connect(OUT);
  o1.start(T);o2.start(T);sub.start(T);o1.stop(T+dur+.05);o2.stop(T+dur+.05);sub.stop(T+dur+.05);
}
function fartSound(kind,k){
  if(!AC||P.vol<=0)return;
  const p=P.pitch,G=.5+.6*P.gas,lo=(70+Math.random()*50)*p;
  if(kind===0){brap(0,.18+.3*Math.random(),(520+Math.random()*320)*p,(300+Math.random()*100)*p,.25*G,{flap:.15,jit:.2,wet:.15,curve:.8,bright:1,harsh:0})}
  else if(kind===1){brap(0,.14+.12*k+Math.random()*.06,lo*1.5,lo*.85,.7*G,{flap:.35,jit:.12,wet:.35,harsh:.8})}
  else if(kind===2){
    const n=2+Math.floor(Math.random()*3);let t=0;
    for(let i=0;i<n;i++){const d=.09+Math.random()*.09;brap(t,d,lo*(1.5-i*.1),lo*.8,.62*G*(1-i*.12),{flap:.3,jit:.15,wet:.3,harsh:.7});t+=d+.04+Math.random()*.05}
  }else if(kind===3){brap(0,(.7+.8*Math.random())*(.6+.5*k),lo*1.7,lo*.55,.65*G,{flap:.65,jit:.22,wet:.45,curve:1.6,harsh:.6})}
  else if(kind===4){
    const n=3+Math.floor(Math.random()*4);let t=0;
    for(let i=0;i<n;i++){const d=.05+Math.random()*.08;brap(t,d,lo*(1.2+Math.random()*.6),lo*.7,.5*G,{flap:.5,jit:.3,wet:.8,harsh:.3});if(Math.random()<.5)setTimeout(bubblePop,t*1000+30);t+=d+.03+Math.random()*.06}
  }else{brap(0,.9,lo*2,lo*1.2,.18*G,{flap:.3,jit:.3,wet:1,bright:1,harsh:0})}
}

// ---------- gas / toot / blast
function puff(n){for(let i=0;i<n;i++)gp.push({x:hx+(Math.random()-.5)*10,y:hy+8,vx:(Math.random()-.5)*50,vy:15+Math.random()*40,r:5+Math.random()*5,life:1.3,l0:1.3})}
function fartBurst(){
  const fr=P.fr,k=.5+fr;
  fartSound(Math.random()<.6+.3*fr?[1,2,2,3][Math.floor(Math.random()*4)]:Math.floor(Math.random()*6),k);
  puff(2+Math.round(fr*4+P.gas*3));
  gasPulse=1;pokeAmt=Math.max(pokeAmt,.5);jv[0]+=8+14*fr;jv[1]+=8+14*fr;
  stored=Math.max(0,stored-.04);
  if(P.liq>=.4&&Math.random()<.35*(1-fr)*P.liq)for(let i=0;i<8;i++)fl.push({x:hx+(Math.random()-.5)*8,y:hy+4,vx:(Math.random()-.5)*160,vy:60+Math.random()*180,r:1.8+Math.random()*2.4,w:0,hs:P.hs});
}
function doToot(k=1){
  audioInit();
  const kind=k>1.5?(Math.random()<.6?3:2):Math.floor(Math.random()*6);
  fartSound(kind,k);
  const n=Math.round((3+P.gas*8)*k);
  for(let i=0;i<n;i++)setTimeout(()=>puff(2),i*55);
  pokeAmt=1;jv[0]+=12*k;jv[1]+=12*k;
  if(P.liq>=.5&&Math.random()<(.3+.4*P.mess)*Math.min(1,k)){
    setTimeout(()=>{for(let i=0;i<Math.round(14*k);i++)fl.push({x:hx+(Math.random()-.5)*8,y:hy+4,vx:(Math.random()-.5)*260*(.5+P.mess),vy:80+Math.random()*260,r:P.sz*.09*(.6+Math.random()),w:0,hs:P.hs})},n*30);
  }
}
function startBlow(k){
  audioInit();
  if(blow)return;
  blow={t:0,k:Math.min(1.8,Math.max(k,.5))};
  stored=Math.max(stored,blow.k);holdOn=false;pres=0;
  if(typeof hb!=='undefined')hb.classList.remove('on');
  vib([60,30,160,40,120]);
  noiseBurst('lowpass',900,.7,.5,.6);tone(80*P.pitch,30,.7,.6,'sawtooth',400);
}
function emitBlow(dt,t){
  const I=Math.min(1.3,stored/1.15)*(.75+.25*Math.sin(t*21+Math.sin(t*5)*2));
  emitAcc+=dt*(70+650*I)*(1+.3*P.mess);
  const cone=.3+.8*Math.min(1,I),sweep=Math.sin(t*8.5)*.35*I+Math.sin(t*3.1)*.2*I;
  while(emitAcc>=1){
    emitAcc--;
    const core=Math.random()<.55,big=Math.random()<.08+P.chunk*.25;
    const ang=(core?(Math.random()-.5)*.35:(Math.random()-.5)*2*cone)+sweep;
    const spd=(260+Math.random()*(500+900*I))*(core?1.1:.85)*(big?.8:1);
    const r=(2.5+hr*.28)*(.5+Math.random())*(big?2.4:1)*(core?1.15:.8);
    const q={x:hx+(Math.random()-.5)*hr,y:hy+hr*.4,vx:Math.sin(ang)*spd,vy:Math.max(40,Math.cos(ang)*spd),r,w:0,hs:P.hs};
    if(core&&!big){q.prev=(lastP&&!lastP.dead)?lastP:null;lastP=q}
    fl.push(q);
  }
  if(fl.length>1300)trim(1300);
}
function endBlow(){
  blow=null;stored=0;pokeAmt=1.2;
  for(let i=0;i<5;i++)setTimeout(()=>{
    for(let k=0;k<8;k++)fl.push({x:hx+(Math.random()-.5)*10,y:hy+6,vx:(Math.random()-.5)*120,vy:40+Math.random()*160,r:2+Math.random()*2.5,w:0,hs:P.hs});
    noiseBurst('bandpass',300+Math.random()*300,3,.1,.3);
  },i*140+Math.random()*100);
  if(Math.random()<.7)bit={t:0,r:4+Math.random()*3,at:2+Math.random()*3,hs:P.hs};
  fartSound(3,1);
}

// ---------- soft body poop
function newCur(){
  const l=P.liq,F=P.firm,hd=Math.max(0,Math.min(1,(F-.65)/.35));
  cur={nodes:[0,1].map(()=>({x:hx,y:hy,px:hx,py:hy,c:0,m:Math.max(.25,2*hr/(P.sz*(1+.35*stored))),id:NID++})),rest:8,feed:0,attached:true,pinch:0,seed:Math.random()*6,born:clk,fade:1,wet:false,sc:0,
    sz:P.sz,liq:l,lump:P.lump,rc:P.sz*.5*(1-.35*l),hs:P.hs,ks:Math.min(1,.7+.3*F+.2*hd),kb:.12*Math.pow(F,1.5)*(1-l)+.5*hd,stick:P.stick*(1-.7*hd),soft:Math.min(1,.25+.6*(1-F)+.6*l)*(1-hd),hard:hd,still:0,t:0,frozen:false};
  cur.sz=P.sz*(1+.35*stored);cur.rc=cur.sz*.5*(1-.35*l);
  pieces.push(cur);
}

      if(q.y<BCY&&ax>lim&&ax<=BA+2){

        if(!q.w&&(!q.ls||q.y-q.ls>10)){q.ls=q.y;stains.push({x:q.x+Math.sign(q.x-X)*q.r*.4,y:q.y,r:q.r*.7,hs:q.hs})}

    if(q.y>H+20||q.y<-60||q.x<-30||q.x>W+30){kill(k);continue}
    if(q.y>BCY){

      const col=Math.max(0,Math.min(NC-1,Math.floor((q.x-(X-BA))/CW)));

function pbb(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const n of p.nodes){if(n.x<x0)x0=n.x;if(n.x>x1)x1=n.x;if(n.y<y0)y0=n.y;if(n.y>y1)y1=n.y}return [x0,y0,x1,y1]}
function useP(){
  const act=[],fz=[];
  for(const p of pieces){if(p.frozen){if(!p.bb)p.bb=pbb(p);fz.push(p)}else{p.bb=null;act.push(p)}}
  const abb=act.map(pbb),use=act.slice();
  for(const p of fz){const b=p.bb;if(abb.some(a=>a[0]<b[2]+60&&a[2]>b[0]-60&&a[1]<b[3]+60&&a[3]>b[1]-60))use.push(p)}
  return use;
}
function collide(){
  const all=[];
  useP().forEach((p,pi)=>p.nodes.forEach((n,i)=>all.push([n,pi,i,p.rc*(n.m||1)*(1-.4*(n.load||0)*Math.min(1,(p.soft||.5)+.5*(p.mp||0)))*(1-.3*(p.mp||0)),p.stick,p.frozen,p.rest,p.hard||0,p,(i%2===0||i===p.nodes.length-1)])));
  const clampBowl=imp=>{
    for(const [n,,,rc,st,fz,,hd,pc] of all){
      if(fz)continue;
      const lim=BA-rc;
      if(n.x<rc)n.x=rc;if(n.x>W-rc)n.x=W-rc;
      if(n.y>RIM-30){if(n.x<X-lim)n.x=X-lim;if(n.x>X+lim)n.x=X+lim}
      if(n.y>BCY){
        const ex=(n.x-X)/lim,ey=(n.y-BCY)/(BB-rc),v=ex*ex+ey*ey;
        if(v>1){
          const sp=Math.hypot(n.x-n.px,n.y-n.py),vd=n.y-n.py,s=1/Math.sqrt(v);
          n.x=X+ex*s*lim;n.y=BCY+ey*s*(BB-rc);
          if(imp){n.c=Math.min(1,n.c+.12);n.load=Math.min(1,(n.load||0)+Math.min(sp,8)*.03);const f=.25+.6*st;n.px+=(n.x-n.px)*f;n.py+=(n.y-n.py)*f;if(hd>0&&vd>1.5){n.py=n.y+vd*.35*hd;if(vd>3&&hd>.5&&clk-(pc.brk||0)>.15&&Math.random()<.35)hardBreak(pc,n)}}
        }
      }
    }
  };
  clampBowl(true);
  let mr=0;for(const e of all)if(e[3]>mr)mr=e[3];
  const cs=Math.max(40,2*mr),grid=new Map();
  for(let i=0;i<all.length;i++){if(!all[i][9])continue;const n=all[i][0],key=Math.floor(n.x/cs)*1000+Math.floor(n.y/cs);let a=grid.get(key);if(!a){a=[];grid.set(key,a)}a.push(i)}
  for(let i=0;i<all.length;i++){
    const A=all[i];if(A[5]||!A[9])continue;
    const cx=Math.floor(A[0].x/cs),cy=Math.floor(A[0].y/cs);
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const a=grid.get((cx+ox)*1000+cy+oy);if(!a)continue;
      for(const j of a){
        if(j===i)continue;
        const B=all[j];
        if(!B[5]&&j<i)continue;
        const D=A[3]+B[3];
        if(A[1]===B[1]&&Math.abs(A[2]-B[2])<Math.ceil(D/A[6])+1)continue;
        const dx=B[0].x-A[0].x,dy=B[0].y-A[0].y;
        if(Math.abs(dx)>D||Math.abs(dy)>D)continue;
        const d=Math.hypot(dx,dy);
        if(d<D&&d>1e-4){
          const f=Math.min(1,(D-d)/d)*.3,fa=A[5]?0:(B[5]?2:1),fb=B[5]?0:(A[5]?2:1);
          A[0].x-=dx*f*fa;A[0].y-=dy*f*fa;B[0].x+=dx*f*fb;B[0].y+=dy*f*fb;
          const lo=A[0].y>B[0].y?A[0]:B[0];
          if(!A[5])A[0].c=Math.min(1,A[0].c+.05);if(!B[5])B[0].c=Math.min(1,B[0].c+.05);
          lo.load=Math.max(lo.load||0,Math.min(1,(D-d)/D*(Math.abs(dy)/d)*1.5));
        }
      }
    }
  }
  clampBowl(false);
}
function step(h){
  const G=1500*P.grav;
  stepFluid(h);
  for(const p of pieces){
    if(p.frozen)continue;
    const l=p.liq;
    p.nodes.forEach((n,i)=>{
      if(p.attached&&i===0)return;
      const inW=n.y>WL,dmp=(inW?.93-.06*l:.997)*(n.c>.05?.92:1);
      let ax=(n.x-n.px)*dmp,ay=(n.y-n.py)*dmp+(inW?G*.45:G)*h*h;
      const m=Math.hypot(ax,ay);if(m>10){ax*=10/m;ay*=10/m}
      n.px=n.x;n.py=n.y;n.x+=ax;n.y+=ay;n.c*=.985;n.load=(n.load||0)*.996;
      if(!inW&&n.y>WL&&p.sc<=0){p.sc=.2;splash(n.x,4);if(!p.wet){p.wet=true;if(p.hard>.5)clack();else plop()}}
    });
    p.sc-=h;
  }
  let nt=0;for(const p of pieces)if(!p.frozen)nt+=p.nodes.length;
  const iters=nt>350?6:12;
  for(let it=0;it<iters;it++){
    if(grab){grab.n.x=gpos[0];grab.n.y=gpos[1];grab.n.px=grab.n.x;grab.n.py=grab.n.y}
    for(const p of pieces){
      if(p.frozen)continue;
      const N=p.nodes,r=p.rest,ks=p.ks*(1-.5*(p.mp||0)),kb=p.kb*(1-(p.mp||0));
      if(p.attached){N[0].x=hx;N[0].y=hy;N[0].px=hx;N[0].py=hy}
      for(let kk=0;kk<N.length-1;kk++){
        const i=(it&1)?N.length-2-kk:kk;
        const a=N[i],q=N[i+1],dx=q.x-a.x,dy=q.y-a.y,d=Math.hypot(dx,dy);
        const ux=d>1e-3?dx/d:0,uy=d>1e-3?dy/d:1,pin=i===0&&p.attached,rr=pin?p.feed:r,e=d-rr;
        if(pin){q.x-=ux*e;q.y-=uy*e}
        else{const f=e*.5*ks;a.x+=ux*f;a.y+=uy*f;q.x-=ux*f;q.y-=uy*f}
      }
      if(kb>.01)for(let i=0;i<N.length-2;i++){
        const a=N[i],q=N[i+2],dx=q.x-a.x,dy=q.y-a.y,d=Math.hypot(dx,dy)||1e-4,t=1.9*r;
        if(d<t){const f=(d-t)/d*.5*kb,pin=i===0&&p.attached;if(pin){q.x-=dx*f*2;q.y-=dy*f*2}else{a.x+=dx*f;a.y+=dy*f;q.x-=dx*f;q.y-=dy*f}}
      }
    }
    if(nt>200?it===iters-1:it%3===2)collide();
  }
  for(const p of pieces){
    if(p.frozen||p.attached||(grab&&grab.p===p))continue;
    let mx=0,ct=0;
    for(const n of p.nodes){mx=Math.max(mx,Math.hypot(n.x-n.px,n.y-n.py));if(n.c>.05)ct++}
    if(ct>0||p.wet)p.t+=h;
    if(ct>0&&mx<.15)p.still++;else p.still=0;
    if(p.still>40||(p.t>3.5&&mx<.8)||p.t>7){p.frozen=true;for(const n of p.nodes){n.px=n.x;n.py=n.y}}
  }
}

});
c.addEventListener('pointerup',()=>{
  if(grab&&!grab.moved&&clk-grab.t0<.4)stomp(grab.x0,grab.y0);
  if(drag&&!drag.wipe&&!drag.moved){const i=drag.side;jv[i]+=(i?-1:1)*70;mark[i]=Math.min(1,mark[i]+.5);slap(mark[i]);shake=Math.max(shake,2)}
  release();
});
c.addEventListener('pointercancel',release);

// ---------- loop
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clk=now/1000;
  P.hs=hsFor(P.col);SKC=skinCols();openAmt=Math.max(0,Math.min(1,(pull[0]+pull[1]-10*sitAmt)/40));openF=1+.9*openAmt;
  const bt=sitting?SITY:0;
  byv+=((bt-by)*160-byv*14)*dt;by+=byv*dt;
  if(by>SITY){if(byv>60){thud();shake=Math.max(shake,4);jv[0]+=45;jv[1]+=45;pokeAmt=Math.max(pokeAmt,.4)}by=SITY;byv=-Math.abs(byv)*.18}
  if(by<0){by=0;byv=Math.abs(byv)*.1}
  if(Math.abs(by-bt)<.3&&Math.abs(byv)<3){by=bt;byv=0}
  sitAmt=Math.max(0,Math.min(1,by/SITY));hy=Y0+by;bx=0;hx=X;
  if(auto){
    autoT-=dt;
    if(autoT<=0){
      if(state==='idle'){act();autoT=leadTime()+3+Math.random()*4;if(Math.random()<.2)stored=Math.min(1.2,stored+.3)}
      else if(state==='push'){act();autoT=1+Math.random()*2.5;if(Math.random()<.3)doToot(.6+Math.random())}
      else autoT=.3;
    }
  }
  {
    lead=state==='push'?Math.min(1,pushT/(leadTime()+2.5)):0;
    const Dl0=leadTime();crown=state==='push'?Math.max(0,Math.min(1,(pushT-.3*Dl0)/(.7*Dl0+.001))):0;
    const dilT=blow?1:(state==='push'?Math.pow(lead,1.2):0);dil+=(dilT-dil)*Math.min(1,dt*6);
    const full=P.sz*openF*.5*(1+stored*.17)*(.22+.78*(1-P.fr));
    let hrT=2.5+(full-2.5)*Math.pow(dil,.6)+(state==='push'?P.lump*2.2*Math.sin(clk*7)*dil:0);
    if(state!=='push'&&stored>.15)hrT=Math.max(hrT,2.5+stored*5);
    if(state!=='push'&&stored>.3)hrT+=stored*1.2*Math.max(0,Math.sin(clk*17)*Math.sin(clk*3.1));
    hrT+=pokeAmt*2.5-(holdOn?1:0)+gasPulse*3;gasPulse=Math.max(0,gasPulse-dt*4);
    if(state==='clench')hrT*=1-Math.sin(Math.min(1,cl)*Math.PI);
    if(blow)hrT=Math.max(hrT,P.sz*.75+stored*9);
    hr+=(Math.max(2,hrT)-hr)*Math.min(1,dt*16);
  }
  if(state==='push'&&Math.random()<dt*P.gas*(P.liq+.15)*5)hbs.push({x:hx+(Math.random()-.5)*hr,y:hy+hr*.8,r:2,rm:3+Math.random()*6,life:.8+Math.random()*.8,vx:(Math.random()-.5)*14,vy:25});
  for(let i=hbs.length-1;i>=0;i--){
    const q=hbs[i];q.r+=(q.rm-q.r)*Math.min(1,dt*4);q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    if(q.life<=0){bubblePop();for(let k=0;k<2;k++)fl.push({x:q.x,y:q.y,vx:(Math.random()-.5)*60,vy:30+Math.random()*40,r:1.4,w:0,nb:1,hs:P.hs});hbs.splice(i,1)}
  }
  if(state==='push'){
    pushT+=dt;
    const Dl=leadTime(),go=pushT>=Dl,ramp=go?Math.min(1,(pushT-Dl)/(pm?.6:2.5)):0,em=ramp*ramp*(3-2*ramp);
    if(go&&!crowned){crowned=true;if(P.fr<.9)squelch()}
    if(!go&&P.fr<.9){
      for(let i=0;i<2;i++)jv[i]+=(Math.random()-.5)*(2+14*lead);
      if(clk>nextRumbleS){tone((48+Math.random()*20)*P.pitch,36,.5,.16+.2*lead,'sawtooth',200);if(Math.random()<.4)noiseBurst('bandpass',250,3,.12,.18);nextRumbleS=clk+Math.max(.5,1.6-lead)+Math.random()*.8}
      if(lead>.4&&Math.random()<dt*.3*lead*(.3+P.gas))doToot(.35);
    }
    const pf=(1-P.fr)*em,sp=78*P.spd*(1+.3*stored);curSp=sp;len+=sp*Math.max(pf,P.fr>.5?.1:0)*dt;
    if(P.fr>.02){gasT-=dt;if(gasT<=0){fartBurst();gasT=(2.4-1.9*P.fr)*(.6+.8*Math.random())}}
    if(pm){if(pf>.03)emit(sp,dt*pf,clk)}
    else if(pf>.03){
      if(!cur&&!flushing)newCur();
      if(cur){
        cur.feed+=sp*pf*dt;
        while(cur.feed>=cur.rest){cur.feed-=cur.rest;cur.nodes.unshift({x:hx,y:hy,px:hx,py:hy,c:0,m:Math.max(.25,2*hr/cur.sz),id:NID++})}
        if(cur.nodes.length>120)splitOff(cur,80,0);
        autoBreak(cur);
      }
    }
    strain+=((.2+.8*lead)-strain)*Math.min(1,dt*3);
  }else strain+=(0-strain)*Math.min(1,dt*8);
  if(state==='clench'){
    sn+=dt;cl=sn/.42;
    if(cur)cur.pinch=Math.min(1,cl/.45);
    if(!cut&&cl>=.55){
      cut=true;pop();
      if(pm){for(let i=0;i<10;i++)fl.push({x:hx+(Math.random()-.5)*14,y:hy+4,vx:(Math.random()-.5)*160,vy:60+Math.random()*120,r:P.sz*.1*(.6+Math.random()),w:0,hs:P.hs})}
      else if(cur){cur.attached=false;cur.pinch=1;for(let i=0;i<Math.min(3,cur.nodes.length);i++)cur.nodes[i].py=cur.nodes[i].y-1.5;{const lv=(Math.random()-.5)*1.6;for(const nd of cur.nodes)nd.px=nd.x-lv*(.4+Math.random()*.6)}if(P.stick>.15)strand={p:cur};if(Math.random()<.3+.5*P.stick)bit={t:0,r:3+Math.random()*3,at:2.5+Math.random()*3,hs:P.hs};lastMess=clk;cur=null}
      len=0;
    }
    if(cl>=1){state='idle';cl=0;b.textContent='PUSH'}
  }
  if(holdOn)pres=Math.min(4,pres+dt);
  const sqT=(state==='clench'?Math.sin(Math.min(1,cl)*Math.PI)*P.cln:0)+(holdOn?1.2:0)-strain*.5;
  sq+=(sqT-sq)*Math.min(1,dt*18);
  for(let i=0;i<2;i++){
    pull[i]+=(Math.max(pullT[i],5*sitAmt,blow?18*Math.min(1,stored/1.1):0)-pull[i])*Math.min(1,dt*14);
    jv[i]+=(-220*jg[i]-9*jv[i])*dt+(pm&&state==='push'?(Math.random()-.5)*curSp*.03:0);
    if(holdOn)jv[i]+=(Math.random()-.5)*pres*8;
    jg[i]=Math.max(-6,Math.min(6,jg[i]+jv[i]*dt));
    mark[i]=Math.max(0,mark[i]-dt*.2);
  }
  pokeAmt=Math.max(0,pokeAmt-dt*3);
  for(const p of gp){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=.99;p.r+=14*dt;p.life-=dt}
  gp=gp.filter(p=>p.life>0);
  for(let k=bst.length-1;k>=0;k--){
    const t=bst[k];t.y+=t.v*dt;
    if(t.y>150){
      const lxm=cxm(t.side,t.lx)+sq*6;
      fl.push({x:(t.side===0?lxm:2*X-lxm)+bx,y:158+by,vx:0,vy:30,r:t.r*.6,w:0,nb:1,hs:t.hs});
      t.r*=.65;t.v*=.5;t.y=148;t.y0=148;if(t.r<1.6)bst.splice(k,1);
    }
  }
  if(flushing){
    for(const p of pieces)p.fade-=dt*1.2;
    pieces=pieces.filter(p=>p.fade>0);if(cur&&!pieces.includes(cur))cur=null;
    for(let i=0;i<NC;i++)HF[i]=Math.max(0,HF[i]-dt*60);
    stains.splice(0,Math.min(stains.length,14));bst.splice(0,6);smear=Math.max(0,smear-dt*.5);
    if(!pieces.length&&!stains.length&&!bst.length&&HF.every(v=>v<=0))flushing=false;
  }
  if(!holdOn&&stored<.4)stored=Math.min(.4,stored+dt*.008);
  if(holdOn)stored=Math.min(1.8,stored+dt*.22);
  if(state==='push')stored=Math.max(0,stored-dt*.12*(1+curSp/150)*(.2+.8*(1-P.fr)));
  if(blow){
    blow.t+=dt;emitBlow(dt,clk);
    stored=Math.max(0,stored-dt*(.3+.55*stored));
    const I=Math.min(1.3,stored/1.15);
    shake=Math.max(shake,3+9*I);red=1;smear=1;lastMess=clk;
    for(let i=0;i<2;i++)jv[i]+=(Math.random()-.5)*60*I;
    if(Math.random()<dt*10)noiseBurst('bandpass',300+Math.random()*500,3,.07,.25*I);
    if(stored<.04)endBlow();
  }else if((holdOn&&stored>1.3)||stored>1.6)startBlow(stored);
  if(stored>.1&&clk>nextRumble){tone((50+Math.random()*25)*P.pitch,38,.35,.12+.2*Math.min(1,stored),'sawtooth',220);nextRumble=clk+Math.max(.5,2.2-stored*1.6)+Math.random()}
  if(stored>.7&&Math.random()<dt*(stored-.6)*1.2)doToot(.35);
  if(stored>.3)for(let i=0;i<2;i++)jv[i]+=(Math.random()-.5)*stored*20;
  {const pf=$('pf'),pg=$('pmsg');pf.style.width=Math.min(100,stored/1.3*100)+'%';
   pf.style.background=stored>1?'#d32f2f':stored>.7?'#f9a825':'#4caf50';
   pg.textContent=(state==='push'&&!blow&&pushT<leadTime())?'bearing down...':stored>1.05?'ABOUT TO BLOW!':stored>.7?'straining...':stored>.25?'building up':'';}
  smear=state==='push'?Math.min(1,smear+dt*.05*(P.liq+.3)):smear;
  red+=(Math.min(1,strain*.6+(holdOn?pres*.25:0)+stored*.5)-red)*Math.min(1,dt*3);
  shake=Math.max(0,shake-dt*30);
  if(bit){bit.t+=dt;if(bit.t>bit.at){fl.push({x:hx,y:hy+16,vx:0,vy:10,r:bit.r*.9,w:0,nb:1,hs:bit.hs});bit=null}}
  if(strand){
    const nd=strand.p.nodes[0],dd=Math.hypot(nd.x-hx,nd.y-hy);
    if(dd>40+90*P.stick||!pieces.includes(strand.p)){if(dd>40)fl.push({x:hx,y:hy+10,vx:0,vy:20,r:2.2,w:0,nb:1,hs:strand.p.hs});strand=null}
  }
  if(state!=='push'&&smear>.3&&Math.random()<dt*.6*smear)fl.push({x:hx+(Math.random()-.5)*10,y:hy+12,vx:0,vy:5,r:2+Math.random()*1.5,w:0,nb:1,hs:pileHs});
  if(state==='push')lastMess=clk;
  updateBubs(dt);updateSteam(dt);updateMush(dt);
  soundTick(clk);
  acc+=dt;while(acc>=1/90){step(1/90);acc-=1/90}
  const olds=pieces.filter(p=>p!==cur);
  if(olds.length>16){const o=olds[0];o.fade-=dt*2;if(o.fade<=0)pieces.splice(pieces.indexOf(o),1)}
  draw();requestAnimationFrame(tick);
}
function draw(){
  g.clearRect(0,0,W,H);g.save();
  if(shake>.1)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  g.fillStyle='#b7ae9c';g.fillRect(0,FL,W,H-FL);g.fillStyle='rgba(0,0,0,.12)';g.fillRect(0,FL,W,2);
  for(let x=45;x<W;x+=90)g.fillRect(x,FL+2,2,H-FL);
  bowlBack();drawPile();drawStains();
  for(const p of pieces)drawPoop(p);
  drawFl(true);
  bowlFront();drawBubs();
  if(sitAmt>.8){g.fillStyle='rgba(0,0,0,'+.2*sitAmt+')';for(const s of[-1,1]){g.beginPath();g.ellipse(X+s*105+bx,RIM+4,62,6,0,0,7);g.fill()}}
  g.save();g.translate(bx,by);butt();hole();g.restore();
  g.save();g.beginPath();g.rect(0,0,W,WL);g.clip();
  for(const p of pieces){if(p===cur)continue;if(p.nodes.some(n=>n.y<WL+20))drawPoop(p)}
  g.restore();
  drawFl(false);
  if(cur&&cur.nodes.length>=3){g.save();g.beginPath();const y0=hy-hr*.75;g.rect(0,y0,W,WL-y0);g.clip();drawPoop(cur);g.restore()}
  drawStrand();
  g.save();g.translate(bx,by);holeFront();g.restore();drawHBs();
  drawGas();
  if(wipePos){g.fillStyle='rgba(255,255,255,.9)';g.strokeStyle='rgba(0,0,0,.3)';g.lineWidth=1.5;g.beginPath();g.rect(wipePos[0]-15,wipePos[1]-11,30,22);g.fill();g.stroke()}
  if(grab){g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=2;g.beginPath();g.arc(gpos[0],gpos[1],9,0,7);g.stroke()}
  g.restore();
}
requestAnimationFrame(tick);
</script></body></html>
